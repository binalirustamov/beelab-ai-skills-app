name:a("Уверенный","Ishonchli","Confident"),en:"Adoptive",d:a("ИИ — постоянная часть работы.","SI — ishning doimiy qismi.","AI is a regular part of the work.")},{min:90,name:a("Продвинутый","Ilg‘or","Advanced"),en:"Transformative",d:a("Перестраивает процессы и влияет на других.","Jarayonlarni qayta quradi va boshqalarga ta’sir qiladi.","Reshapes processes and influences others.")}],s=a=>a>=90?3:a>=66?2:a>=35?1:0,n={deleg:[a("Не понимает, где ИИ полезен, или отдаёт ему всё подряд","SI qayerda foydali ekanini tushunmaydi yoki unga hamma narsani topshiradi","Doesn't see where AI helps, or hands it everything"),a("Использует ИИ для простых задач: тексты, перевод, идеи","SI’dan oddiy vazifalar uchun foydalanadi: matn, tarjima, g‘oyalar","Uses AI for simple tasks: texts, translation, ideas"),a("Осознанно решает, что делает ИИ, а что человек","Nimani SI, nimani inson qilishini ongli hal qiladi","Deliberately decides what AI does and what a human does"),a("Перестраивает процессы: что автоматизировать, где оставить контроль","Jarayonlarni qayta quradi: nimani avtomatlashtirish, qayerda nazorat qoldirish","Redesigns processes: what to automate, where to keep control")],prompt:[a("Пишет короткие общие запросы","Qisqa va umumiy so‘rovlar yozadi","Writes short, generic requests"),a("Даёт контекст и цель, но без формата и ограничений","Kontekst va maqsadni beradi, lekin format va cheklovlarsiz","Gives context and goal, but no format or constraints"),a("Задаёт роль, факты, формат, ограничения и примеры","Rol, faktlar, format, cheklovlar va misollarni beradi","Sets role, facts, format, constraints and examples"),a("Создаёт шаблоны промптов и ассистентов для других","Boshqalar uchun prompt shablonlari va yordamchilar yaratadi","Builds prompt templates and assistants for others")],verify:[a("Принимает ответ ИИ как есть","SI javobini qanday bo‘lsa, shunday qabul qiladi","Accepts AI output as is"),a("Замечает явные ошибки","Aniq xatolarni payqaydi","Spots obvious errors"),a("Систематически сверяет факты, цифры и источники","Faktlar, raqamlar va manbalarni muntazam tekshiradi","Systematically checks facts, figures and sources"),a("Задаёт стандарты проверки для команды","Jamoa uchun tekshiruv standartlarini belgilaydi","Sets checking standards for the team")],data:[a("Может вставить в ИИ персональные данные","SI’ga shaxsiy ma’lumotlarni kiritishi mumkin","May paste personal data into AI"),a("Знает правила, но не всегда применяет","Qoidalarni biladi, lekin har doim qo‘llamaydi","Knows the rules but doesn't always apply them"),a("Обезличивает данные, согласовывает обязательства","Ma’lumotlarni shaxssizlashtiradi, majburiyatlarni kelishadi","Anonymises data, gets commitments approved"),a("Помогает выстраивать правила и обучает коллег","Qoidalarni ishlab chiqishga yordam beradi va hamkasblarni o‘rgatadi","Helps shape the rules and trains colleagues")],integ:[a("Не использует ИИ или пробовал пару раз","SI’dan foydalanmaydi yoki bir-ikki marta sinab ko‘rgan","Doesn't use AI or tried it a couple of times"),a("Использует от случая к случаю","Vaqti-vaqti bilan foydalanadi","Uses it now and then"),a("ИИ — ежедневная часть работы","SI — kundalik ishning bir qismi","AI is part of everyday work"),a("Внедряет ИИ в команде, делится практиками","Jamoada SI’ni joriy qiladi, tajriba ulashadi","Rolls out AI in the team and shares practices")]},o={deleg:a("Составьте список своих рабочих задач и отметьте: что ИИ может сделать сам, что с вашей проверкой, а что только вы.","Ish vazifalaringiz ro‘yxatini tuzing va belgilang: nimani SI o‘zi qila oladi, nimani sizning tekshiruvingiz bilan, nimani faqat siz.","List your work tasks and mark what AI can do alone, what needs your review, and what only you should do."),prompt:a("Используйте формулу: роль → задача → факты → формат → ограничения → пример. Дорабатывайте ответ в 2–3 шага.","Formuladan foydalaning: rol → vazifa → faktlar → format → cheklovlar → misol. Javobni 2–3 qadamda takomillashtiring.","Use the formula: role → t m bor","I have ready prompts for recurring tasks")],[a("Настроенные ассистенты","Sozlangan yordamchilar","Custom assistants"),a("Свои GPT, проекты, инструкции под мои задачи","Vazifalarimga moslangan GPT, loyihalar, ko‘rsatmalar","My own GPTs, projects and instructions for my tasks")],[a("ИИ встроен в процессы","SI jarayonlarga o‘rnatilgan","AI built into processes"),a("Автоматизации и интеграции, обучаю коллег","Avtomatlashtirish va integratsiyalar, hamkasblarni o‘rgataman","Automations and integrations; I train colleagues")]],p=[a("Факты","Faktlar","Facts"),a("Цифры","Raqamlar","Figures"),a("Тон и стиль","Ohang va uslub","Tone & style"),a("Формат","Format","Format"),a("Логику или код","Mantiq yoki kod","Logic or code"),a("Ничего не исправлял(а)","Hech narsani tuzatmadim","Nothing to fix")],m=[{id:"c1",c:"verify",q:{ru:"ИИ подготовил справку со ссылкой на исследование: название, год и процент. Что разумно сделать перед отправкой руководителю?",uz:"SI ma’lumotnoma tayyorladi: tadqiqot nomi, yili va foiz ko‘rsatilgan. Rahbarga yuborishdan oldin nima qilish to‘g‘ri?",en:"AI drafted a brief citing a study with a title, year and percentage. What should you do before sending it to your manager?"},o:[{ru:"Найти первоисточник и сверить цифру; если не нашли — убрать или пометить как неподтверждённое",uz:"Asl manbani topib, raqamni solishtirish; topilmasa — olib tashlash yoki tasdiqlanmagan deb belgilash",en:"Find the original source and check the figure; if you can't, remove it or mark it as unverified"},{ru:"Попросить ИИ дать ссылку: если ссылка есть, значит источник настоящий",uz:"SI’dan havola so‘rash: havola bo‘lsa, manba haqiqiy",en:"Ask the AI for a link: if it gives one, the source is real"},{ru:"Оставить цифру, но убрать название исследования",uz:"Raqamni qoldirib, tadqiqot nomini olib tashlash",en:"Keep the figure but remove the study's name"},{ru:"Попросить другой ИИ-инструмент подтвердить цифру",uz:"Boshqa SI vositasidan raqamni tasdiqlashni so‘rash",en:"Ask a different AI tool to confirm the figure"}],a:null,ex:null},{id:"c2",c:"verify",q:{ru:"ИИ посчитал итог по выгрузке из 300 строк. Как надёжнее всего проверить результат?",uz:"SI 300 qatorli jadval bo‘yicha jami summani hisobladi. Natijani qanday ishonchli tekshirish mumkin?",en:"AI totalled a 300-row export. What is the most reliable way to check the result?"},o:[{ru:"Задать тот же вопрос ещё раз: если ответ совпадёт, он верный",uz:"Xuddi shu savolni yana berish: javob mos kelsa, demak to‘g‘ri",en:"Ask the same question again: if the answer matches, it's correct"},{ru:"Пересчитать формулой в Excel или попросить ИИ написать формулу и проверить её на части данных",uz:"Excel formulasi bilan qayta hisoblash yoki SI’dan formula yozdirib, uni ma’lumotlarning bir qismida tekshirish",en:"Recalculate with an Excel formula, or have the AI write the formula and test it on a sample"},{ru:"Попросить ИИ «перепроверить себя»",uz:"SI’dan «o‘zini qayta tekshirishni» so‘rash",en:'Ask the AI to "double-check itself"'},{ru:"Если ИИ показал ход расчёта, проверка не нужна",uz:"SI hisob-kitob jarayonini ko‘rsatgan bo‘lsa, tekshirish shart emas",en:"If the AI showed its working, no check is needed"}],a:null,ex:null},{id:"c3",c:"data",q:{ru:"Что из этого можно вставить в публичный ИИ-сервис без отдельного согласования?",uz:"Quyidagilardan qaysi birini alohida kelishuvsiz ommaviy SI xizmatiga joylash mumkin?",en:"Which of these can you paste into a public AI service without separate approval?"},o:[{ru:"Выгрузку обращений клиентов, если убрать только ФИО",uz:"Mijozlar murojaatlari ro‘yxatini, faqat F.I.Sh. olib tashlangan holda",en:"An export of customer requests with only the names removed"},{ru:"Фрагмент кода с ключами доступа к тестовому стенду",uz:"Test serveriga kirish kalitlari bor kod parchasini",en:"A code snippet containing access keys to a test environment"},{ru:"Текст уже опубликованного пресс-релиза компании",uz:"Kompaniyaning allaqachon e’lon qilingan press-relizi matnini",en:"The text of a company press release that is already public"},{ru:"Черновик договора с партнёром, если убрать суммы",uz:"Hamkor bilan shartnoma loyihasini, summalarni olib tashlab",en:"A draft partner contract with the amounts removed"}],a:null,ex:null},{id:"c4",c:"data",q:{ru:"Коллега предлагает «на минутку» загрузить в ИИ-ассистент таблицу с паспортными данными клиентов, чтобы найти ошибки. Ваше действие?",uz:"Hamkasb xatolarni topish uchun mijozlarning pasport ma’lumotlari jadvalini SI yordamchisiga «bir daqiqaga» yuklashni taklif qilmoqda. Nima qilasiz?",en:'A colleague suggests uploading a table of customers\' passport data to an AI assistant "just for a minute" to find errors. What do you do?'},o:[{ru:"Согласиться, если потом удалить чат",uz:"Keyin chatni o‘chirib tashlash sharti bilan rozi bo‘lish",en:"Agree, as long as you delete the chat afterwards"},{ru:"Предложить обезличить данные или использовать одобренный компанией инструмент; при сомнениях — спросить отдел ИБ",uz:"Ma’lumotlarni shaxssizlashtirish yoki kompaniya tasdiqlagan vositadan foydalanishni taklif qilish; shubha bo‘lsa — AX bo‘limidan so‘rash",en:"Suggest anonymising the data or using a company-approved tool; if unsure, ask the security team"},{ru:"Согласиться, если подписка на ИИ-сервис платная",uz:"SI xizmatiga obuna pullik bo‘lsa, rozi bo‘lish",en:"Agree if the AI subscription is a paid one"},{ru:"Загрузить только половину таблицы",uz:"Jadvalning faqat yarmini yuklash",en:"Upload only half of the table"}],a:null,ex:null},{id:"c5",c:"verify",q:{ru:"Вы спрашиваете ИИ о тарифе, запущенном на прошлой неделе. ИИ отвечает уверенно и подробно. Что важно учитывать?",uz:"SI’dan o‘tgan hafta ishga tushgan tarif haqida so‘rayapsiz. SI ishonch bilan batafsil javob beradi. Nimani hisobga olish kerak?",en:"You ask the AI about a tariff launched last week. It answers confidently and in detail. What matters here?"},o:[{ru:"Уверенный и подробный ответ — признак того, что модель знает тему",uz:"Ishonchli va batafsil javob — model mavzuni bilishining belgisi",en:"A confident, detailed answer means the model knows the topic"},{ru:"Если у ИИ включён поиск в интернете, проверять не нужно",uz:"SI’da internet qidiruvi yoqilgan bo‘lsa, tekshirish shart emas",en:"If the AI has web search on, there's no need to check"},{ru:"Нужно добавить в запрос «отвечай только правду»",uz:"So‘rovga «faqat haqiqatni yoz» deb qo‘shish kerak",en:'Add "tell only the truth" to the prompt'},{ru:"Модель могла не знать о тарифе: дать актуальные данные в запросе или сверить с официальным источником",uz:"Model bu tarif haqida bilmasligi mumkin: so‘rovda dolzarb ma’lumot berish yoki rasmiy manba bilan solishtirish",en:"The model may not know about it: give current facts in the prompt or check against the official source"}],a:null,ex:null},{id:"c6",c:"prompt",q:{ru:"Ответ ИИ получился общим и «водянистым». Какой следующий шаг даст наибольший эффект?",uz:"SI javobi umumiy va «suvli» chiqdi. Qaysi keyingi qadam eng katta natija beradi?",en:"The AI's answer came out generic and wordy. Which next step helps most?"},o:[{ru:"Написать «сделай лучше и профессиональнее»",uz:"«Yaxshiroq va professionalroq qil» deb yozish",en:'Write "make it better and more professional"'},{ru:"Перегенерировать ответ несколько раз и выбрать лучший",uz:"Javobni bir necha marta qayta yaratib, eng yaxshisini tanlash",en:"Regenerate several times and pick the best one"},{ru:"Уточнить аудиторию, цель, ключевые факты и формат и показать пример нужного результата",uz:"Auditoriya, maqsad, asosiy faktlar va formatni aniqlashtirib, kerakli natijaga misol ko‘rsatish",en:"Specify the audience, goal, key facts and format, and show an example of what you want"},{ru:"Попросить сократить текст вдвое",uz:"Matnni ikki baravar qisqartirishni so‘rash",en:"Ask it to cut the text in half"}],a:null,ex:null},{id:"c7",c:"prompt",q:{ru:"Как снизить риск, что ИИ добавит выдуманные факты в текст для клиентов?",uz:"SI mijozlar uchun matnga to‘qima faktlar qo‘shish xavfini qanday kamaytirish mumkin?",en:"How do you reduce the risk of the AI adding made-up facts to a customer text?"},o:[{ru:"Дать исходные факты, попросить опираться только на них и прямо сказать, если данных не хватает",uz:"Asl faktlarni berib, faqat ularga tayanishni va ma’lumot yetishmasa, buni ochiq aytishni so‘rash",en:"Provide the source facts, ask it to rely only on them, and to say so if information is missing"},{ru:"Попросить писать увереннее и без оговорок",uz:"Ishonchliroq va izohlarsiz yozishni so‘rash",en:"Ask it to write more confidently, without caveats"},{ru:"Написать в запросе «ты эксперт с 20-летним опытом»",uz:"So‘rovda «sen 20 yillik tajribaga ega mutaxassissan» deb yozish",en:'Write "you are an expert with 20 years\' experience"'},{ru:"Ограничить длину ответа",uz:"Javob uzunligini cheklash",en:"Limit the length of the answer"}],a:null,ex:null},{id:"c8",c:"verify",q:{ru:"ИИ подготовил ответ клиенту и пообещал компенсацию за сбой. Что делать?",uz:"SI mijozga javob tayyorladi va nosozlik uchun kompensatsiya va’da qildi. Nima qilish kerak?",en:"The AI drafted a reply to a customer and promised compensation for an outage. What do you do?"},o:[{ru:"Отправить: формулировка вежливая, клиент будет доволен",uz:"Yuborish: matn xushmuomala, mijoz mamnun bo‘ladi",en:"Send it: the wording is polite and the customer will be happy"},{ru:"Проверить обещание по регламенту компании и согласовать его до отправки",uz:"Va’dani kompaniya reglamenti bo‘yicha tekshirib, yuborishdan oldin kelishib olish",en:"Check the promise against company rules and get it approved before sending"},{ru:"Убрать сумму, а само обещание оставить",uz:"Summani olib tashlab, va’daning o‘zini qoldirish",en:"Remove the amount but keep the promise"},{ru:"Отправить с пометкой, что текст подготовил ИИ",uz:"Matnni SI tayyorlagani haqida belgi bilan yuborish",en:"Send it with a note that AI wrote it"}],a:null,ex:null},{id:"c9",c:"deleg",q:{ru:"Какую задачу не стоит полностью отдавать ИИ?",uz:"Qaysi vazifani to‘liq SI’ga topshirmaslik kerak?",en:"Which task should not be handed over to AI entirely?"},o:[{ru:"Составить черновик письма коллегам",uz:"Hamkasblarga xat loyihasini tuzish",en:"Drafting an email to colleagues"},{ru:"Придумать варианты заголовков для рассылки",uz:"Xabar yuborish uchun sarlavha variantlarini o‘ylab topish",en:"Brainstorming subject lines for a mailing"},{ru:"Окончательно решить, одобрить ли клиенту кредит",uz:"Mijozga kredit berish-bermaslikni yakuniy hal qilish",en:"Making the final decision on a customer's loan"},{ru:"Перевести внутреннюю заметку на английский",uz:"Ichki eslatmani ingliz tiliga tarjima qilish",en:"Translating an internal note into English"}],a:null,ex:null},{id:"c10",c:"prompt",q:{ru:"Нужно, чтобы ИИ выдал данные строго в заданной структуре для таблицы. Что работает лучше всего?",uz:"SI ma’lumotlarni jadval uchun qat’iy tuzilmada berishi kerak. Nima eng yaxshi ishlaydi?",en:"You need the AI to return data in a strict structure for a spreadsheet. What works best?"},o:[{ru:"Попросить «сделай таблицу красиво»",uz:"«Jadvalni chiroyli qil» deb so‘rash",en:'Ask it to "make a nice table"'},{ru:"Вставить данные: ИИ сам поймёт нужную структуру",uz:"Ma’lumotlarni joylash: SI kerakli tuzilmani o‘zi tushunadi",en:"Paste the data: the AI will figure out the structure"},{ru:"Описать колонки и формат значений и показать пример 1–2 строк",uz:"Ustunlar va qiymatlar formatini tasvirlab, 1–2 qatorli misol ko‘rsatish",en:"Describe the columns and value formats and show 1–2 example rows"},{ru:"Писать запрос только на английском",uz:"So‘rovni faqat ingliz tilida yozish",en:"Write the prompt in English only"}],a:null,ex:null}],y={an:[{id:"a1",c:"verify",q:{ru:"ИИ посчитал средний чек по выгрузке из 2 000 строк. Как проверить?",uz:"SI 2 000 qatorli jadval bo‘yicha o‘rtacha chekni hisobladi. Qanday tekshirish kerak?",en:"AI calculated the average order value from a 2,000-row export. How do you check it?"},o:[{ru:"Спросить ИИ ещё раз",uz:"SI’dan yana so‘rash",en:"Ask the AI again"},{ru:"Пересчитать формулой в Excel или проверить на части данных",uz:"Excel formulasi bilan qayta hisoblash yoki ma’lumotlarning bir qismida tekshirish",en:"Recalculate with an Excel formula or check on a sample"},{ru:"Если ИИ показал ход решения, проверка не нужна",uz:"SI yechim jarayonini ko‘rsatgan bo‘lsa, tekshirish shart emas",en:"If the AI showed its working, no check is needed"}],a:null,ex:null},{id:"a2",c:"deleg",q:{ru:"Нужно понять, почему упало удержание клиентов. Как распределить работу?",uz:"Mijozlarni ushlab qolish nega pasayganini tushunish kerak. Ishni qanday taqsimlash kerak?",en:"You need to understand why customer retention dropped. How do you split the work?"},o:[{ru:"ИИ сам находит причину",uz:"SI sababni o‘zi topadi",en:"The AI finds the cause on its own"},{ru:"ИИ предлагает гипотезы, вы проверяете их на данных",uz:"SI gipotezalar taklif qiladi, siz ularni ma’lumotlarda tekshirasiz",en:"The AI suggests hypotheses, you test them on the data"},{ru:"ИИ здесь бесполезен",uz:"Bu yerda SI foydasiz",en:"AI is useless here"}],a:null,ex:null},{id:"a3",c:"data",q:{ru:"Нужна помощь ИИ с анализом оттока по выгрузке транзакций. Что сделать с данными?",uz:"Tranzaksiyalar ro‘yxati bo‘yicha mijozlar ketishini tahlil qilishda SI yordami kerak. Ma’lumotlar bilan nima qilish kerak?",en:"You want AI help analysing churn from a transaction export. What do you do with the data?"},o:[{ru:"Загрузить как есть, так точнее",uz:"Boricha yuklash, shunda aniqroq",en:"Upload it as is, it's more accurate"},{ru:"Убрать идентификаторы (номер карты, телефон) и агрегировать до нужного уровня",uz:"Identifikatorlarni (karta raqami, telefon) olib tashlab, kerakli darajagacha jamlash",en:"Remove identifiers (card number, phone) and aggregate to the level you need"},{ru:"Загрузить только первые 100 строк",uz:"Faqat birinchi 100 qatorni yuklash",en:"Upload only the first 100 rows"}],a:null,ex:null},{id:"a4",c:"prompt",q:{ru:"Как попросить ИИ написать SQL-запрос для когортного анализа, чтобы результат подошёл с первого раза?",uz:"Kogorta tahlili uchun SQL so‘rovini birinchi urinishdayoq yaroqli qilib yozdirish uchun SI’dan qanday so‘rash kerak?",en:"How do you ask AI for a cohort-analysis SQL query so it works first time?"},o:[{ru:"Написать «сделай когортный анализ»",uz:"«Kogorta tahlilini qil» deb yozish",en:'Write "do a cohort analysis"'},{ru:"Описать структуру таблиц (колонки, типы), что считать и пример ожидаемого результата",uz:"Jadvallar tuzilmasini (ustunlar, turlar), nimani hisoblashni va kutilgan natija misolini tasvirlash",en:"Describe the table structure (columns, types), what to calculate and an example of the expected output"},{ru:"Приложить скриншот дашборда",uz:"Dashboard skrinshotini ilova qilish",en:"Attach a screenshot of the dashboard"}],a:null,ex:null},{id:"a5",c:"verify",q:{ru:"ИИ сделал вывод: «рост продаж вызван новой рекламной кампанией». Что делать?",uz:"SI xulosa qildi: «sotuvlar o‘sishi yangi reklama kampaniyasi tufayli». Nima qilish kerak?",en:'AI concluded: "the sales growth was caused by the new ad campaign". What do you do?'},o:[{ru:"Принять: по времени совпадает",uz:"Qabul qilish: vaqt bo‘yicha mos keladi",en:"Accept it: the timing matches"},{ru:"Проверить другие факторы: сезонность, контрольную группу, изменения цен",uz:"Boshqa omillarni tekshirish: mavsumiylik, nazorat guruhi, narx o‘zgarishlari",en:"Check other factors: seasonality, a control group, price changes"},{ru:"Попросить ИИ подтвердить вывод",uz:"SI’dan xulosani tasdiqlashni so‘rash",en:"Ask the AI to confirm the conclusion"}],a:null,ex:null}],it:[{id:"i1",c:"verify",q:{ru:"ИИ написал SQL-запрос для отчёта. Что делать перед запуском в продакшене?",uz:"SI hisobot uchun SQL so‘rovini yozdi. Prodakshnda ishga tushirishdan oldin nima qilish kerak?",en:"AI wrote an SQL query for a report. What do you do before running it in production?"},o:[{ru:"Запустить: синтаксис корректный",uz:"Ishga tushirish: sintaksis to‘g‘ri",en:"Run it: the syntax is correct"},{ru:"Прогнать на тестовой базе и проверить граничные случаи",uz:"Test bazasida ishlatib, chegaraviy holatlarni tekshirish",en:"Run it on a test database and check edge cases"},{ru:"Попросить ИИ подтвердить, что запрос верный",uz:"SI’dan so‘rov to‘g‘riligini tasdiqlashni so‘rash",en:"Ask the AI to confirm the query is right"}],a:null,ex:null},{id:"i2",c:"data",q:{ru:"Нужно разобрать ошибку по логу, в котором есть токены и номера карт. Как поступить?",uz:"Tokenlar va karta raqamlari bor log bo‘yicha xatoni tahlil qilish kerak. Qanday yo‘l tutasiz?",en:"You need to debug using a log that contains tokens and card numbers. What do you do?"},o:[{ru:"Вставить лог целиком, так быстрее",uz:"Logni to‘liq joylash, shunda tezroq",en:"Paste the whole log, it's faster"},{ru:"Замаскировать секреты и персональные данные, затем вставить",uz:"Sirlar va shaxsiy ma’lumotlarni yashirib, keyin joylash",en:"Mask secrets and personal data, then paste"},{ru:"Вставить только половину лога",uz:"Logning faqat yarmini joylash",en:"Paste only half of the log"}],a:null,ex:null},{id:"i3",c:"verify",q:{ru:"ИИ предложил подключить библиотеку с подходящим названием, но вы о ней не слышали. Что делать?",uz:"SI mos nomli kutubxonani ulashni taklif qildi, lekin siz u haqida eshitmagansiz. Nima qilish kerak?",en:"AI suggested a library with a fitting name, but you've never heard of it. What do you do?"},o:[{ru:"Установить: ИИ знает лучше",uz:"O‘rnatish: SI yaxshiroq biladi",en:"Install it: the AI knows best"},{ru:"Проверить, что пакет существует, поддерживается и безопасен",uz:"Paket mavjudligini, qo‘llab-quvvatlanishini va xavfsizligini tekshirish",en:"Check that the package exists, is maintained and is safe"},{ru:"Попросить ИИ написать эту библиотеку самому",uz:"SI’dan bu kutubxonani o‘zi yozishni so‘rash",en:"Ask the AI to write the library itself"}],a:null,ex:null},{id:"i4",c:"deleg",q:{ru:"Что разумно отдать ИИ-ассистенту в разработке?",uz:"Dasturlashda SI yordamchisiga nimani topshirish oqilona?",en:"What is sensible to hand to an AI assistant in development?"},o:[{ru:"Финальное решение по архитектуре платёжного модуля",uz:"To‘lov modulining arxitekturasi bo‘yicha yakuniy qaror",en:"The final architecture decision for the payments module"},{ru:"Черновик юнит-тестов и шаблонного кода с последующим ревью",uz:"Keyinchalik ko‘rib chiqiladigan unit-testlar va shablon kod loyihasi",en:"A draft of unit tests and boilerplate code, followed by review"},{ru:"Ревью безопасности без участия человека",uz:"Inson ishtirokisiz xavfsizlik tekshiruvi",en:"A security review with no human involved"}],a:null,ex:null},{id:"i5",c:"prompt",q:{ru:"ИИ выдаёт код, который не подходит под ваш проект. Что улучшить в запросе?",uz:"SI loyihangizga mos kelmaydigan kod beradi. So‘rovda nimani yaxshilash kerak?",en:"The AI produces code that doesn't fit your project. What should you improve in the prompt?"},o:[{ru:"Попросить «пиши лучше»",uz:"«Yaxshiroq yoz» deb so‘rash",en:'Ask it to "write better"'},{ru:"Указать язык, версии, стиль, существующий код и ограничения",uz:"Til, versiyalar, uslub, mavjud kod va cheklovlarni ko‘rsatish",en:"Specify the language, versions, style, existing code and constraints"},{ru:"Сменить модель",uz:"Modelni almashtirish",en:"Switch to another model"}],a:null,ex:null}],sp:[{id:"s1",c:"verify",q:{ru:"ИИ подготовил ответ клиенту и пообещал вернуть комиссию. Что делать?",uz:"SI mijozga javob tayyorladi va komissiyani qaytarishni va’da qildi. Nima qilish kerak?",en:"The AI drafted a reply promising to refund the customer's fee. What do you do?"},o:[{ru:"Отправить: клиент будет доволен",uz:"Yuborish: mijoz mamnun bo‘ladi",en:"Send it: the customer will be happy"},{ru:"Проверить обещание по регламенту и согласовать",uz:"Va’dani reglament bo‘yicha tekshirib, kelishib olish",en:"Check the promise against the rules and get approval"},{ru:"Убрать сумму, оставить обещание",uz:"Summani olib tashlab, va’dani qoldirish",en:"Remove the amount, keep the promise"}],a:null,ex:null},{id:"s2",c:"prompt",q:{ru:"Как получить от ИИ точный шаблон ответа клиенту о задержке перевода?",uz:"Pul o‘tkazmasi kechikishi haqida mijozga aniq javob shablonini SI’dan qanday olish mumkin?",en:"How do you get an accurate reply template from AI for a delayed transfer?"},o:[{ru:"Написать «ответь клиенту про задержку»",uz:"«Mijozga kechikish haqida javob ber» deb yozish",en:'Write "reply to the customer about the delay"'},{ru:"Дать регламент, факты и тон, попросить не добавлять ничего сверх фактов",uz:"Reglament, faktlar va ohangni berib, faktlardan tashqari hech narsa qo‘shmaslikni so‘rash",en:"Give the rules, facts and tone, and ask it to add nothing beyond the facts"},{ru:"Попросить ответить как можно вежливее",uz:"Iloji boricha xushmuomala javob berishni so‘rash",en:"Ask it to be as polite as possible"}],a:null,ex:null},{id:"s3",c:"data",q:{ru:"Клиент прислал скриншот с номером карты. Нужно с помощью ИИ составить ответ. Как поступить?",uz:"Mijoz karta raqami ko‘rinadigan skrinshot yubordi. SI yordamida javob tuzish kerak. Qanday yo‘l tutasiz?",en:"A customer sent a screenshot showing their card number. You want AI to help draft a reply. What do you do?"},o:[{ru:"Вставить скриншот в ИИ",uz:"Skrinshotni SI’ga joylash",en:"Paste the screenshot into the AI"},{ru:"Описать ситуацию своими словами без номера карты и личных данных",uz:"Vaziyatni karta raqami va shaxsiy ma’lumotlarsiz o‘z so‘zlaringiz bilan tasvirlash",en:"Describe the situation in your own words, without the card number or personal data"},{ru:"Вставить, но попросить ИИ не запоминать данные",uz:"Joylash, lekin SI’dan ma’lumotlarni eslab qolmaslikni so‘rash",en:"Paste it but ask the AI not to remember the data"}],a:null,ex:null},{id:"s4",c:"deleg",q:{ru:"Что можно доверить ИИ-ассистенту в поддержке без проверки оператором?",uz:"Qo‘llab-quvvatlashda SI yordamchisiga operator tekshiruvisiz nimani ishonib topshirish mumkin?",en:"What can an AI assistant in support handle without an operator checking?"},o:[{ru:"Ответы на частые вопросы по утверждённой базе знаний",uz:"Tasdiqlangan bilimlar bazasi bo‘yicha ko‘p beriladigan savollarga javoblar",en:"Answers to FAQs from an approved knowledge base"},{ru:"Решения о возврате денег",uz:"Pulni qaytarish bo‘yicha qarorlar",en:"Decisions on refunds"},{ru:"Ответы на жалобы, направленные в регулятор",uz:"Regulyatorga yuborilgan shikoyatlarga javoblar",en:"Responses to complaints sent to the regulator"}],a:null,ex:null},{id:"s5",c:"verify",q:{ru:"ИИ-ассистент ответил клиенту: «комиссия за перевод 0%». Вы не уверены. Что делать?",uz:"SI yordamchi mijozga «o‘tkazma komissiyasi 0%» deb javob berdi. Siz ishonchingiz komil emas. Nima qilish kerak?",en:'The AI assistant told a customer "the transfer fee is 0%". You\'re not sure. What do you do?'},o:[{ru:"Оставить: клиент доволен",uz:"Qoldirish: mijoz mamnun",en:"Leave it: the customer is happy"},{ru:"Сверить с актуальными тарифами и исправить при необходимости",uz:"Dolzarb tariflar bilan solishtirib, kerak bo‘lsa tuzatish",en:"Check against current tariffs and correct if needed"},{ru:"Дописать «по данным ИИ»",uz:"«SI ma’lumotlariga ko‘ra» deb qo‘shib qo‘yish",en:'Add "according to AI"'}],a:null,ex:null}],hr:[{id:"h1",c:"data",q:{ru:"Нужно сравнить 30 резюме кандидатов с помощью ИИ. Как правильно?",uz:"30 ta nomzod rezyumesini SI yordamida solishtirish kerak. Qanday qilish to‘g‘ri?",en:"You want AI to compare 30 candidate CVs. What is the right way?"},o:[{ru:"Загрузить резюме целиком в публичный ИИ",uz:"Rezyumelarni to‘liq ommaviy SI’ga yuklash",en:"Upload the full CVs to a public AI"},{ru:"Обезличить резюме или использовать одобренный компанией инструмент",uz:"Rezyumelarni shaxssizlashtirish yoki kompaniya tasdiqlagan vositadan foydalanish",en:"Anonymise the CVs or use a company-approved tool"},{ru:"Загрузить только резюме с hh.uz, они и так публичные",uz:"Faqat hh.uz’dagi rezyumelarni yuklash, ular baribir ommaviy",en:"Upload only CVs from hh.uz, they're public anyway"}],a:null,ex:null},{id:"h3",c:"deleg",q:{ru:"Что разумно отдать ИИ в подборе персонала?",uz:"Xodimlarni tanlashda SI’ga nimani topshirish oqilona?",en:"What is sensible to hand to AI in recruitment?"},o:[{ru:"Окончательный отбор кандидатов без участия человека",uz:"Inson ishtirokisiz nomzodlarni yakuniy tanlash",en:"Final candidate selection with no human involved"},{ru:"Черновик описания вакансии и вопросов для интервью",uz:"Vakansiya tavsifi va suhbat savollari loyihasi",en:"A draft job description and interview questions"},{ru:"Оценку «культурного соответствия» по фото кандидата",uz:"Nomzod surati bo‘yicha «madaniy moslik»ni baholash",en:'Judging "culture fit" from a candidate\'s photo'}],a:null,ex:null},{id:"h4",c:"verify",q:{ru:"ИИ отсортировал кандидатов, и в топе почти одни мужчины одного возраста. Что делать?",uz:"SI nomzodlarni saraladi va yuqorida deyarli faqat bir xil yoshdagi erkaklar. Nima qilish kerak?",en:"AI ranked the candidates, and the top is almost all men of the same age. What do you do?"},o:[{ru:"Принять: ИИ объективен",uz:"Qabul qilish: SI xolis",en:"Accept it: the AI is objective"},{ru:"Проверить критерии на предвзятость и пересмотреть список вручную",uz:"Mezonlarni xolislikka tekshirib, ro‘yxatni qo‘lda qayta ko‘rib chiqish",en:"Check the criteria for bias and review the list manually"},{ru:"Попросить ИИ отсортировать ещё раз",uz:"SI’dan yana bir bor saralashni so‘rash",en:"Ask the AI to rank them again"}],a:null,ex:null},{id:"h5",c:"prompt",q:{ru:"Нужен текст вакансии от ИИ, который не будет шаблонным. Что сделать?",uz:"SI’dan shablon bo‘lmagan vakansiya matni kerak. Nima qilish kerak?",en:"You want a job ad from AI that doesn't sound generic. What do you do?"},o:[{ru:"Написать «напиши вакансию аналитика»",uz:"«Tahlilchi vakansiyasini yoz» deb yozish",en:'Write "write an analyst job ad"'},{ru:"Дать задачи, требования, условия, тон бренда и пример удачной вакансии",uz:"Vazifalar, talablar, shartlar, brend ohangi va muvaffaqiyatli vakansiya misolini berish",en:"Give the tasks, requirements, conditions, brand tone and an example of a good ad"},{ru:"Попросить «сделать креативно»",uz:"«Kreativ qil» deb so‘rash",en:'Ask it to "be creative"'}],a:null,ex:null},{id:"h6",c:"verify",q:{ru:"ИИ составил обзор зарплат на рынке для аналитика в Ташкенте с точными цифрами. Что делать?",uz:"SI Toshkentdagi tahlilchi uchun aniq raqamlar bilan bozordagi maoshlar sharhini tuzdi. Nima qilish kerak?",en:"AI produced a market salary overview for an analyst in Tashkent with exact figures. What do you do?"},o:[{ru:"Использовать цифры в оффере",uz:"Raqamlarni taklifda ishlatish",en:"Use the figures in the offer"},{ru:"Сверить с актуальными обзорами рынка и внутренними данными",uz:"Bozorning dolzarb sharhlari va ichki ma’lumotlar bilan solishtirish",en:"Check them against current market surveys and internal data"},{ru:"Попросить ИИ указать источник и использовать",uz:"SI’dan manbani ko‘rsatishni so‘rab, foydalanish",en:"Ask the AI for a source and use them"}],a:null,ex:null}],mk:[{id:"h2",c:"verify",q:{ru:"ИИ написал пост: «Beepul — лидер рынка платежей №1 в Узбекистане». Что делать?",uz:"SI post yozdi: «Beepul — O‘zbekistonda to‘lovlar bozorining 1-raqamli yetakchisi». Nima qilish kerak?",en:'AI wrote a post: "Beepul is the No. 1 payments leader in Uzbekistan". What do you do?'},o:[{ru:"Опубликовать: звучит убедительно",uz:"E’lon qilish: ishonarli eshitiladi",en:"Publish it: it sounds convincing"},{ru:"Проверить утверждение по данным и согласовать формулировку",uz:"Da’voni ma’lumotlar bo‘yicha tekshirib, ifodani kelishib olish",en:"Check the claim against data and get the wording approved"},{ru:"Заменить «№1» на «один из лидеров» и опубликовать",uz:"«1-raqamli»ni «yetakchilardan biri»ga almashtirib, e’lon qilish",en:'Change "No. 1" to "one of the leaders" and publish'}],a:null,ex:null},{id:"m2",c:"data",q:{ru:"Нужно сегментировать базу для рассылки с помощью ИИ. В выгрузке есть ФИО, телефоны и суммы покупок. Как поступить?",uz:"SI yordamida xabar yuborish uchun bazani segmentlash kerak. Ro‘yxatda F.I.Sh., telefonlar va xaridlar summasi bor. Qanday yo‘l tutasiz?",en:"You want AI to segment a mailing base. The export has names, phone numbers and purchase amounts. What do you do?"},o:[{ru:"Загрузить всё: так сегменты будут точнее",uz:"Hammasini yuklash: shunda segmentlar aniqroq bo‘ladi",en:"Upload everything so the segments are more accurate"},{ru:"Оставить ID и обезличенные признаки: сумма, регион, частота покупок",uz:"ID va shaxssizlashtirilgan belgilarni qoldirish: summa, hudud, xarid chastotasi",en:"Keep the ID and anonymised attributes: amount, region, purchase frequency"},{ru:"Убрать телефоны, оставить ФИО",uz:"Telefonlarni olib tashlab, F.I.Sh.ni qoldirish",en:"Remove phone numbers but keep names"}],a:null,ex:null},{id:"m3",c:"prompt",q:{ru:"Как получить от ИИ рекламные тексты в стиле бренда Beepul?",uz:"SI’dan Beepul brendi uslubida reklama matnlarini qanday olish mumkin?",en:"How do you get ad copy from AI in Beepul's brand voice?"},o:[{ru:"Попросить «напиши креативно»",uz:"«Kreativ yoz» deb so‘rash",en:'Ask it to "be creative"'},{ru:"Дать бренд-гайд, аудиторию, ограничения и 2–3 примера удачных текстов",uz:"Brend qo‘llanmasi, auditoriya, cheklovlar va 2–3 ta muvaffaqiyatli matn misolini berish",en:"Give the brand guide, audience, constraints and 2–3 examples of good copy"},{ru:"Попросить написать «как у конкурентов»",uz:"«Raqobatchilardagidek» yozishni so‘rash",en:'Ask it to write "like the competitors"'}],a:null,ex:null},{id:"m4",c:"deleg",q:{ru:"Что разумно отдать ИИ в маркетинге?",uz:"Marketingda SI’ga nimani topshirish oqilona?",en:"What is sensible to hand to AI in marketing?"},o:[{ru:"Варианты заголовков и черновики текстов для A/B-теста",uz:"A/B-test uchun sarlavha variantlari va matn loyihalari",en:"Headline options and draft copy for an A/B test"},{ru:"Утверждение финального бюджета кампании",uz:"Kampaniyaning yakuniy byudjetini tasdiqlash",en:"Approving the final campaign budget"},{ru:"Ответы на юридические претензии клиентов",uz:"Mijozlarning huquqiy da’volariga javoblar",en:"Responding to customers' legal claims"}],a:null,ex:null},{id:"m5",c:"verify",q:{ru:"ИИ сгенерировал картинку для баннера, на ней узнаваемый персонаж из мультфильма. Что делать?",uz:"SI banner uchun rasm yaratdi, unda multfilmdagi taniqli qahramon bor. Nima qilish kerak?",en:"AI generated a banner image featuring a recognisable cartoon character. What do you do?"},o:[{ru:"Использовать: раз сгенерировано, значит свободно",uz:"Foydalanish: SI yaratgan bo‘lsa, demak erkin",en:"Use it: if AI generated it, it's free to use"},{ru:"Не использовать: риск нарушения авторских прав; перегенерировать без узнаваемых образов",uz:"Foydalanmaslik: mualliflik huquqini buzish xavfi; taniqli obrazlarsiz qayta yaratish",en:"Don't use it: copyright risk; regenerate without recognisable figures"},{ru:"Немного изменить цвета и использовать",uz:"Ranglarini biroz o‘zgartirib foydalanish",en:"Change the colours a bit and use it"}],a:null,ex:null}],sec:[{id:"x1",c:"data",q:{ru:"Нужно с помощью ИИ разобрать подозрительный лог с IP-адресами клиентов и внутренними хостами. Как поступить?",uz:"SI yordamida mijozlar IP-manzillari va ichki xostlar bor shubhali logni tahlil qilish kerak. Qanday yo‘l tutasiz?",en:"You want AI to analyse a suspicious log with customer IP addresses and internal hosts. What do you do?"},o:[{ru:"Вставить лог в публичный ИИ",uz:"Logni ommaviy SI’ga joylash",en:"Paste the log into a public AI"},{ru:"Использовать одобренный внутренний инструмент или замаскировать IP и имена хостов",uz:"Tasdiqlangan ichki vositadan foydalanish yoki IP va xost nomlarini yashirish",en:"Use an approved internal tool or mask IPs and host names"},{ru:"Вставить, удалив только даты",uz:"Faqat sanalarni olib tashlab, joylash",en:"Paste it with only the dates removed"}],a:null,ex:null},{id:"x2",c:"verify",q:{ru:"ИИ проанализировал уязвимость и уверенно сообщает, что CVE не затрагивает вашу версию ПО. Что делать?",uz:"SI zaiflikni tahlil qildi va CVE dasturingiz versiyasiga ta’sir qilmasligini ishonch bilan aytmoqda. Nima qilish kerak?",en:"AI analysed a vulnerability and confidently says the CVE doesn't affect your software version. What do you do?"},o:[{ru:"Закрыть тикет",uz:"Tiketni yopish",en:"Close the ticket"},{ru:"Сверить с официальным бюллетенем вендора и проверить версию",uz:"Ishlab chiqaruvchining rasmiy byulleteni bilan solishtirib, versiyani tekshirish",en:"Check the vendor's official advisory and verify the version"},{ru:"Спросить другой ИИ",uz:"Boshqa SI’dan so‘rash",en:"Ask a different AI"}],a:null,ex:null},{id:"x3",c:"deleg",q:{ru:"Что разумно отдать ИИ в работе по информационной безопасности?",uz:"Axborot xavfsizligi ishida SI’ga nimani topshirish oqilona?",en:"What is sensible to hand to AI in information security work?"},o:[{ru:"Черновик политики или первичный разбор логов с последующей проверкой",uz:"Siyosat loyihasi yoki keyinchalik tekshiriladigan loglarning dastlabki tahlili",en:"A draft policy or first-pass log review, followed by checking"},{ru:"Самостоятельную блокировку учётных записей без проверки",uz:"Tekshiruvsiz hisob qaydnomalarini mustaqil bloklash",en:"Blocking accounts on its own without review"},{ru:"Финальное решение по инциденту",uz:"Hodisa bo‘yicha yakuniy qaror",en:"The final decision on an incident"}],a:null,ex:null},{id:"x4",c:"prompt",q:{ru:"Как попросить ИИ помочь с правилом детектирования для SIEM?",uz:"SIEM uchun aniqlash qoidasini yozishda SI’dan qanday yordam so‘rash kerak?",en:"How do you ask AI to help write a SIEM detection rule?"},o:[{ru:"Написать «сделай правило на взлом»",uz:"«Buzib kirishga qoida yoz» deb yozish",en:'Write "make a rule for hacking"'},{ru:"Указать SIEM и синтаксис, источник логов, поля, что детектировать и пример событий",uz:"SIEM va sintaksis, log manbai, maydonlar, nimani aniqlash va hodisalar misolini ko‘rsatish",en:"Specify the SIEM and syntax, log source, fields, what to detect and example events"},{ru:"Попросить «самое надёжное правило»",uz:"«Eng ishonchli qoida»ni so‘rash",en:'Ask for "the most reliable rule"'}],a:null,ex:null},{id:"x5",c:"verify",q:{ru:"Сотрудник получил голосовое сообщение «от директора» с просьбой срочно перевести деньги. Голос похож. Что делать?",uz:"Xodim «direktordan» zudlik bilan pul o‘tkazish so‘ralgan ovozli xabar oldi. Ovoz o‘xshaydi. Nima qilish kerak?",en:'An employee got a voice message "from the CEO" asking for an urgent money transfer. The voice sounds right. What should happen?'},o:[{ru:"Выполнить: голос узнаваемый",uz:"Bajarish: ovoz taniqli",en:"Do it: the voice is recognisable"},{ru:"Проверить запрос по другому каналу: голос может быть сгенерирован ИИ",uz:"So‘rovni boshqa kanal orqali tekshirish: ovoz SI tomonidan yaratilgan bo‘lishi mumkin",en:"Verify the request through another channel: the voice may be AI-generated"},{ru:"Перезвонить на номер из сообщения",uz:"Xabardagi raqamga qo‘ng‘iroq qilish",en:"Call back the number in the message"}],a:null,ex:null}],sl:[{id:"l1",c:"data",q:{ru:"Перед встречей с корпоративным клиентом вы хотите, чтобы ИИ подготовил предложение. Что можно передать ИИ?",uz:"Korporativ mijoz bilan uchrashuvdan oldin SI taklif tayyorlashini xohlaysiz. SI’ga nimani berish mumkin?",en:"Before a meeting with a corporate client you want AI to draft a proposal. What can you give the AI?"},o:[{ru:"Полный договор с ценами и контактами клиента",uz:"Narxlar va mijoz kontaktlari bilan to‘liq shartnoma",en:"The full contract with prices and client contacts"},{ru:"Обезличенное описание задачи клиента и публичные условия продукта",uz:"Mijoz vazifasining shaxssizlashtirilgan tavsifi va mahsulotning ommaviy shartlari",en:"An anonymised description of the client's need and the product's public terms"},{ru:"Всю переписку с клиентом",uz:"Mijoz bilan barcha yozishmalar",en:"The entire correspondence with the client"}],a:null,ex:null},{id:"l2",c:"verify",q:{ru:"ИИ составил коммерческое предложение и указал скидку 20% и бесплатное подключение. Что делать?",uz:"SI tijorat taklifini tuzdi va 20% chegirma hamda bepul ulanishni ko‘rsatdi. Nima qilish kerak?",en:"AI drafted a commercial offer with a 20% discount and free onboarding. What do you do?"},o:[{ru:"Отправить: клиенту понравится",uz:"Yuborish: mijozga yoqadi",en:"Send it: the client will like it"},{ru:"Сверить условия с утверждённым прайсом и своими полномочиями, согласовать",uz:"Shartlarni tasdiqlangan narxlar va vakolatlaringiz bilan solishtirib, kelishib olish",en:"Check the terms against the approved price list and your authority, and get approval"},{ru:"Убрать скидку, оставить бесплатное подключение",uz:"Chegirmani olib tashlab, bepul ulanishni qoldirish",en:"Remove the discount, keep free onboarding"}],a:null,ex:null},{id:"l3",c:"prompt",q:{ru:"Как подготовить с ИИ ответ на возражение «у конкурента дешевле»?",uz:"«Raqobatchida arzonroq» degan e’tirozga SI bilan qanday javob tayyorlash mumkin?",en:'How do you prepare a reply to the objection "the competitor is cheaper" with AI?'},o:[{ru:"Написать «помоги продать»",uz:"«Sotishga yordam ber» deb yozish",en:'Write "help me sell"'},{ru:"Дать описание продукта, отличия от конкурента, профиль клиента и попросить 3 варианта ответа",uz:"Mahsulot tavsifi, raqobatchidan farqlari, mijoz profilini berib, 3 ta javob variantini so‘rash",en:"Give the product description, differences from the competitor, the client profile, and ask for 3 reply options"},{ru:"Попросить «убедить клиента любой ценой»",uz:"«Mijozni har qanday yo‘l bilan ishontirishni» so‘rash",en:'Ask it to "convince the client at any cost"'}],a:null,ex:null},{id:"l4",c:"deleg",q:{ru:"Что разумно отдать ИИ в продажах?",uz:"Savdoda SI’ga nimani topshirish oqilona?",en:"What is sensible to hand to AI in sales?"},o:[{ru:"Черновик письма после встречи с клиентом",uz:"Mijoz bilan uchrashuvdan keyingi xat loyihasi",en:"A draft follow-up email after a client meeting"},{ru:"Решение о кредитном лимите для партнёра",uz:"Hamkor uchun kredit limiti bo‘yicha qaror",en:"Deciding a partner's credit limit"},{ru:"Подписание договора от имени компании",uz:"Kompaniya nomidan shartnoma imzolash",en:"Signing a contract on the company's behalf"}],a:null,ex:null},{id:"l5",c:"verify",q:{ru:"ИИ подготовил анализ рынка с долями конкурентов для презентации клиенту. Что делать?",uz:"SI mijozga taqdimot uchun raqobatchilar ulushlari bilan bozor tahlilini tayyorladi. Nima qilish kerak?",en:"AI prepared a market analysis with competitor shares for a client presentation. What do you do?"},o:[{ru:"Вставить в презентацию",uz:"Taqdimotga qo‘shish",en:"Put it in the presentation"},{ru:"Найти источники цифр или убрать неподтверждённые данные",uz:"Raqamlar manbalarini topish yoki tasdiqlanmagan ma’lumotlarni olib tashlash",en:"Find sources for the figures or remove unverified data"},{ru:"Добавить пометку «по оценкам ИИ»",uz:"«SI baholariga ko‘ra» belgisini qo‘shish",en:'Add a note "AI estimates"'}],a:null,ex:null}],pr:[{id:"r1",c:"verify",q:{ru:"ИИ проанализировал 500 отзывов и пишет: «70% пользователей просят тёмную тему». Что делать?",uz:"SI 500 ta sharhni tahlil qildi va «foydalanuvchilarning 70% qorong‘i mavzuni so‘rayapti» deb yozdi. Nima qilish kerak?",en:'AI analysed 500 reviews and says "70% of users ask for dark mode". What do you do?'},o:[{ru:"Поставить задачу в roadmap",uz:"Vazifani roadmap’ga qo‘yish",en:"Put it on the roadmap"},{ru:"Проверить на выборке отзывов, как ИИ посчитал",uz:"SI qanday hisoblaganini sharhlar namunasida tekshirish",en:"Check on a sample of reviews how the AI counted"},{ru:"Попросить ИИ подтвердить цифру",uz:"SI’dan raqamni tasdiqlashni so‘rash",en:"Ask the AI to confirm the figure"}],a:null,ex:null},{id:"r2",c:"deleg",q:{ru:"Что разумно отдать ИИ в продуктовой работе?",uz:"Mahsulot ishida SI’ga nimani topshirish oqilona?",en:"What is sensible to hand to AI in product work?"},o:[{ru:"Кластеризацию отзывов и черновик PRD с последующей проверкой",uz:"Sharhlarni klasterlash va keyinchalik tekshiriladigan PRD loyihasi",en:"Clustering reviews and drafting a PRD, followed by review"},{ru:"Финальное решение о приоритетах roadmap",uz:"Roadmap ustuvorliklari bo‘yicha yakuniy qaror",en:"The final roadmap prioritisation decision"},{ru:"Общение с регулятором о новом продукте",uz:"Yangi mahsulot bo‘yicha regulyator bilan muloqot",en:"Communicating with the regulator about a new product"}],a:null,ex:null},{id:"r3",c:"prompt",q:{ru:"Как попросить ИИ написать user stories для новой функции?",uz:"Yangi funksiya uchun user story yozishni SI’dan qanday so‘rash kerak?",en:"How do you ask AI to write user stories for a new feature?"},o:[{ru:"Написать «напиши user stories»",uz:"«User story yoz» deb yozish",en:'Write "write user stories"'},{ru:"Описать цель, пользователей, сценарии, ограничения и формат «как… я хочу… чтобы…» с критериями приёмки",uz:"Maqsad, foydalanuvchilar, ssenariylar, cheklovlar va qabul mezonlari bilan «men… sifatida… xohlayman… uchun» formatini tasvirlash",en:'Describe the goal, users, scenarios, constraints and the "as a… I want… so that…" format with acceptance criteria'},{ru:"Приложить скриншот конкурента",uz:"Raqobatchi skrinshotini ilova qilish",en:"Attach a competitor screenshot"}],a:null,ex:null},{id:"r4",c:"data",q:{ru:"Для анализа воронки вы хотите загрузить в ИИ сырые события пользователей с номерами телефонов. Как поступить?",uz:"Voronkani tahlil qilish uchun SI’ga telefon raqamlari bilan foydalanuvchilarning xom hodisalarini yuklamoqchisiz. Qanday yo‘l tutasiz?",en:"For funnel analysis you want to upload raw user events with phone numbers to AI. What do you do?"},o:[{ru:"Загрузить как есть: так точнее",uz:"Boricha yuklash: shunda aniqroq",en:"Upload as is, it's more accurate"},{ru:"Агрегировать данные и убрать идентификаторы",uz:"Ma’lumotlarni jamlab, identifikatorlarni olib tashlash",en:"Aggregate the data and remove identifiers"},{ru:"Загрузить данные только за один день",uz:"Faqat bir kunlik ma’lumotlarni yuklash",en:"Upload only one day of data"}],a:null,ex:null},{id:"r5",c:"verify",q:{ru:"Прототип интерфейса, сделанный с ИИ, выглядит отлично. Что сделать до передачи в разработку?",uz:"SI bilan yaratilgan interfeys prototipi juda yaxshi ko‘rinadi. Dasturlashga berishdan oldin nima qilish kerak?",en:"An interface prototype made with AI looks great. What do you do before handing it to development?"},o:[{ru:"Сразу передать в разработку",uz:"Darhol dasturlashga berish",en:"Hand it over right away"},{ru:"Проверить с пользователями и на соответствие требованиям безопасности и доступности",uz:"Foydalanuvchilar bilan va xavfsizlik hamda qulaylik talablariga muvofiqligini tekshirish",en:"Test it with users and against security and accessibility requirements"},{ru:"Попросить ИИ оценить свой прототип",uz:"SI’dan o‘z prototipini baholashni so‘rash",en:"Ask the AI to rate its own prototype"}],a:null,ex:null}],cp:[{id:"k1",c:"verify",q:{ru:"ИИ ссылается на «статью 15 Закона о платёжных системах» и цитирует её. Что делать?",uz:"SI «To‘lov tizimlari to‘g‘risidagi qonunning 15-moddasi»ga havola qiladi va undan iqtibos keltiradi. Nima qilish kerak?",en:'AI cites "Article 15 of the Payment Systems Law" and quotes it. What do you do?'},o:[{ru:"Использовать в заключении",uz:"Xulosada ishlatish",en:"Use it in the opinion"},{ru:"Найти актуальный текст закона в официальном источнике и сверить",uz:"Qonunning dolzarb matnini rasmiy manbadan topib, solishtirish",en:"Find the current text of the law in an official source and compare"},{ru:"Переформулировать цитату своими словами",uz:"Iqtibosni o‘z so‘zlaringiz bilan qayta ifodalash",en:"Rephrase the quote in your own words"}],a:null,ex:null},{id:"k2",c:"data",q:{ru:"Нужно с помощью ИИ проверить анкету клиента по AML. В анкете паспортные данные и источник доходов. Как поступить?",uz:"SI yordamida mijoz anketasini AML bo‘yicha tekshirish kerak. Anketada pasport ma’lumotlari va daromad manbai bor. Qanday yo‘l tutasiz?",en:"You want AI to help review a customer's AML questionnaire. It contains passport data and source of income. What do you do?"},o:[{ru:"Вставить анкету в публичный ИИ",uz:"Anketani ommaviy SI’ga joylash",en:"Paste the questionnaire into a public AI"},{ru:"Использовать одобренный инструмент или обезличить данные",uz:"Tasdiqlangan vositadan foydalanish yoki ma’lumotlarni shaxssizlashtirish",en:"Use an approved tool or anonymise the data"},{ru:"Вставить, убрав только фамилию",uz:"Faqat familiyani olib tashlab, joylash",en:"Paste it with only the surname removed"}],a:null,ex:null},{id:"k3",c:"deleg",q:{ru:"Что разумно отдать ИИ в комплаенсе?",uz:"Komplayensda SI’ga nimani topshirish oqilona?",en:"What is sensible to hand to AI in compliance?"},o:[{ru:"Первичный обзор изменений законодательства с проверкой юристом",uz:"Yurist tekshiruvi bilan qonunchilik o‘zgarishlarini dastlabki ko‘rib chiqish",en:"A first-pass review of legal changes, checked by a lawyer"},{ru:"Итоговое решение о блокировке операции клиента",uz:"Mijoz operatsiyasini bloklash bo‘yicha yakuniy qaror",en:"The final decision to block a customer's transaction"},{ru:"Ответ регулятору без проверки",uz:"Tekshiruvsiz regulyatorga javob",en:"A reply to the regulator without review"}],a:null,ex:null},{id:"k4",c:"prompt",q:{ru:"Как попросить ИИ сравнить внутреннюю политику с новым требованием регулятора?",uz:"SI’dan ichki siyosatni regulyatorning yangi talabi bilan solishtirishni qanday so‘rash kerak?",en:"How do you ask AI to compare an internal policy with a new regulatory requirement?"},o:[{ru:"Написать «проверь политику»",uz:"«Siyosatni tekshir» deb yozish",en:'Write "check the policy"'},{ru:"Дать текст политики и требования и попросить таблицу расхождений со ссылками на пункты",uz:"Siyosat va talab matnini berib, bandlarga havolalar bilan farqlar jadvalini so‘rash",en:"Provide both texts and ask for a table of gaps with references to clauses"},{ru:"Попросить «сделать политику соответствующей»",uz:"«Siyosatni muvofiq qilishni» so‘ras
